<app-card title="Status">
  <dl class="status-list">
    <div>
      <dt>State</dt>
      <dd><app-status-label [status]="state().status" /></dd>
    </div>

    @for (item of statusCardItems(); track item.label) {
      <div>
        <dt>{{ item.label }}</dt>
        <dd>{{ item.message }}</dd>
      </div>
    }
  </dl>
  <p class="message" role="status" aria-live="polite" aria-atomic="true">
    {{ state().message }}
  </p>
</app-card>
